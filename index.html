<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#faf7f1" />
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.json">
  <title>ورود | تایپ‌هاب TypeHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#faf7f1;--bg-soft:#f4efe6;--card:#ffffff;--ink:#1a2333;--muted:#6b7280;--faint:#9aa1ad;--line:#ece5d8;
      --navy:#1c2b4a;--coral:#ff6a5c;--coral-dark:#e85548;--coral-soft:#fff0ee;
      --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;
      --shadow:0 16px 44px rgba(26,35,51,.10);--radius:20px;
    }
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.7}
    button,input{font:inherit}
    .wrap{width:min(430px,100%)}
    .brand{display:flex;align-items:center;gap:13px;justify-content:center;margin-bottom:10px}
    .logo{width:54px;height:54px;border-radius:16px;background:var(--navy);display:grid;place-items:center;font-size:25px;color:#fff;box-shadow:var(--shadow)}
    .brand h1{font-size:19px;margin:0;font-weight:900;letter-spacing:-.3px}
    .brand h1 .lat{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:block;font-weight:600;letter-spacing:1px}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
    .tagline{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
    .tagline b{color:var(--coral-dark)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}
    .tabs{display:flex;background:var(--bg-soft);border-radius:13px;padding:4px;margin-bottom:20px}
    .tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;cursor:pointer;font-weight:800;font-size:14px}
    .tabs button.active{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(26,35,51,.10)}
    .field{margin-bottom:13px}.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:700}
    .field input{width:100%;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px}
    .field input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 4px rgba(255,106,92,.13)}
    .submit{width:100%;border:0;border-radius:13px;padding:13px;background:var(--coral);color:#fff;font-weight:900;font-size:15.5px;cursor:pointer;margin-top:6px;box-shadow:0 10px 26px rgba(255,106,92,.35);transition:background .15s}
    .submit:hover{background:var(--coral-dark)}
    .submit:disabled{opacity:.6;cursor:wait}
    .msg{display:none;border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:14px;font-weight:700}
    .msg.show{display:block}
    .msg.error{background:#fdeeee;color:#b91c1c;border:1px solid #f5c1c1}
    .msg.warn{background:#fff7e8;color:#b45309;border:1px solid #f3d9a4}
    .msg.success{background:#e9f9f0;color:#15803d;border:1px solid #b7e6c9}
    .announce{display:none;background:#fffdf5;border:1px dashed var(--line);border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--muted);margin-bottom:16px}
    .announce.show{display:block}.announce b{color:var(--ink);display:block;font-size:13px;margin-bottom:2px}
    .hint{text-align:center;color:var(--faint);font-size:11.5px;margin-top:14px}
    .guest{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:12px;box-shadow:0 4px 14px rgba(26,35,51,.06)}
    .guest:hover{border-color:var(--coral)}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">⌨️</div>
      <div><h1 id="siteName">تایپ‌هاب<span class="lat">TYPEHUB</span></h1><p>دیکته و تایپ انگلیسی برای فارسی‌زبانان</p></div>
    </div>
    <p class="tagline">اول <b>گوش</b> بده. بعد، دقیق <b>تایپ</b> کن.</p>

    <div class="announce" id="announce"><b>اطلاعیه</b><span id="announceText"></span></div>

    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="active">ورود</button>
        <button id="tabSignup">ثبت‌نام</button>
      </div>

      <div class="msg" id="msg"></div>

      <form id="loginForm" autocomplete="on">
        <div class="field"><label>ایمیل</label><input type="email" id="loginEmail" required dir="ltr" style="text-align:left" placeholder="you@example.com"></div>
        <div class="field"><label>گذرواژه</label><input type="password" id="loginPass" required placeholder="••••••••"></div>
        <button class="submit" id="loginBtn">ورود به تایپ‌هاب</button>
      </form>

      <form id="signupForm" class="hidden" autocomplete="on">
        <div class="field"><label>نام و نام خانوادگی</label><input type="text" id="suName" required placeholder="مثلاً یونی"></div>
        <div class="field"><label>ایمیل</label><input type="email" id="suEmail" required dir="ltr" style="text-align:left" placeholder="you@example.com"></div>
        <div class="field"><label>گذرواژه (حداقل ۸ کاراکتر)</label><input type="password" id="suPass" required minlength="8" placeholder="••••••••"></div>
        <button class="submit" id="signupBtn">ثبت‌نام</button>
        <p class="hint">حساب‌های جدید پس از تأیید مدیر فعال می‌شوند.</p>
      </form>
    </div>
    <a class="guest" href="app.html">✍️ ادامه به‌صورت مهمان ←</a>
  </div>

<script>
(function(){
  var msg=document.getElementById('msg');
  function showMsg(text,kind){msg.textContent=text;msg.className='msg show '+kind;}
  function hideMsg(){msg.className='msg';}
  function api(path,method,body){
    return fetch(path,{method:method||'GET',headers:{'Content-Type':'application/json'},credentials:'same-origin',
      body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(j){return {status:r.status,body:j};});});
  }
  function goPanel(role){location.replace(role==='admin'?'/admin.html':'/app.html');}

  api('/api/public/site').then(function(r){
    if(r.body.ok){
      var s=r.body.site||{};
      if(s.site_name){document.getElementById('siteName').childNodes[0].textContent=s.site_name;document.title='ورود | '+s.site_name;}
      if(s.announcement){document.getElementById('announceText').textContent=s.announcement;document.getElementById('announce').classList.add('show');}
    }
  });
  api('/api/auth/me').then(function(r){if(r.body.ok&&r.body.user)goPanel(r.body.user.role);});

  var tabLogin=document.getElementById('tabLogin'),tabSignup=document.getElementById('tabSignup'),
      loginForm=document.getElementById('loginForm'),signupForm=document.getElementById('signupForm');
  function selectTab(login){
    tabLogin.classList.toggle('active',login);tabSignup.classList.toggle('active',!login);
    loginForm.classList.toggle('hidden',!login);signupForm.classList.toggle('hidden',login);hideMsg();
  }
  tabLogin.addEventListener('click',function(){selectTab(true);});
  tabSignup.addEventListener('click',function(){selectTab(false);});

  loginForm.addEventListener('submit',function(e){
    e.preventDefault();hideMsg();
    var btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='در حال ورود…';
    api('/api/auth/login','POST',{email:document.getElementById('loginEmail').value,password:document.getElementById('loginPass').value})
    .then(function(r){
      btn.disabled=false;btn.textContent='ورود به تایپ‌هاب';
      if(r.body.ok){goPanel(r.body.user.role);return;}
      showMsg(r.body.message||'خطایی رخ داد.',r.body.error==='pending'?'warn':'error');
    }).catch(function(){btn.disabled=false;btn.textContent='ورود به تایپ‌هاب';showMsg('ارتباط با سرور برقرار نشد.','error');});
  });

  signupForm.addEventListener('submit',function(e){
    e.preventDefault();hideMsg();
    var btn=document.getElementById('signupBtn');btn.disabled=true;btn.textContent='در حال ثبت‌نام…';
    api('/api/auth/signup','POST',{name:document.getElementById('suName').value,email:document.getElementById('suEmail').value,password:document.getElementById('suPass').value})
    .then(function(r){
      btn.disabled=false;btn.textContent='ثبت‌نام';
      if(r.status===201){signupForm.reset();showMsg('ثبت‌نام انجام شد! حساب شما پس از تأیید مدیر فعال می‌شود و می‌توانید وارد شوید.','success');return;}
      showMsg(r.body.message||'خطایی رخ داد.','error');
    }).catch(function(){btn.disabled=false;btn.textContent='ثبت‌نام';showMsg('ارتباط با سرور برقرار نشد.','error');});
  });
})();
</script>
</body>
</html>
